<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vizyonsuzlar 😂</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

/* ŞİFRE EKRANI */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.loginBox {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 40px 30px;
    background: #151515;
    border-radius: 25px;
}

.loginLogo {
    width: 190px;
    max-width: 75%;
    margin: 15px auto 20px;
    display: block;
}

.lock {
    font-size: 42px;
}

.subtitle {
    color: #999;
    margin: 10px 0 25px;
}

input {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    text-align: center;
    margin-bottom: 12px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#error {
    display: none;
    color: #ff5555;
    margin-top: 15px;
}


/* ANA SAYFA */

#mainScreen {
    display: none;
    min-height: 100vh;
}

.banner {
    width: 100%;
    overflow: hidden;
}

.banner img {
    width: 100%;
    display: block;
}

.content {
    max-width: 1000px;
    margin: auto;
    padding: 35px 20px 70px;
    text-align: center;
}

.logo {
    width: 170px;
    max-width: 60%;
    margin: 10px auto 15px;
}

.slogan {
    color: #aaa;
    font-size: 18px;
    margin-bottom: 30px;
}


/* MÜZİK */

.musicBox {
    max-width: 450px;
    margin: 0 auto 40px;
    padding: 20px;
    background: #151515;
    border-radius: 20px;
}

.musicTitle {
    margin-bottom: 12px;
    color: #ddd;
}


/* FOTOĞRAFLAR */

.photos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.photo {
    border-radius: 20px;
    overflow: hidden;
    background: #171717;
}

.photo img {
    width: 100%;
    height: 100%;
    min-height: 450px;
    object-fit: cover;
    display: block;
}


/* MESAJ */

.message {
    margin-top: 50px;
    padding: 30px;
    background: #151515;
    border-radius: 20px;
}

.message h2 {
    margin-top: 0;
}

.message p {
    color: #aaa;
    line-height: 1.7;
}


/* TELEFON */

@media (max-width: 700px) {

    .photos {
        grid-template-columns: 1fr;
    }

    .photo img {
        min-height: 400px;
    }

    .content {
        padding: 30px 15px 60px;
    }
}

</style>
</head>

<body>


<!-- ŞİFRE EKRANI -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="lock">🔐</div>

        <img 
            src="logo%20viz.jfif"
            class="loginLogo"
            alt="Vizyonsuzlar"
        >

        <div class="subtitle">
            Burada önemli hiçbir şey yok... 😂
        </div>

        <input
            type="password"
            id="password"
            placeholder="Şifreyi gir"
            onkeypress="enterKey(event)"
        >

        <button onclick="checkPassword()">
            GİRİŞ
        </button>

        <div id="error">
            Yanlış şifre 😏
        </div>

    </div>

</div>


<!-- ANA SAYFA -->

<div id="mainScreen">

    <!-- BANNER -->

    <div class="banner">

        <img 
            src="barner%20viz.jfif"
            alt="Vizyonsuzlar Banner"
        >

    </div>


    <div class="content">

        <!-- LOGO -->

        <img 
            src="logo%20viz.jfif"
            class="logo"
            alt="Vizyonsuzlar"
        >

        <div class="slogan">
            Plan yok. Vizyon yok. Ama anı çok. 😂
        </div>


        <!-- MÜZİK -->

        <div class="musicBox">

            <div class="musicTitle">
                🎵 Vizyonsuzlar'ın Resmi Müziği
            </div>

            <button 
                onclick="toggleMusic()"
                id="musicButton"
            >
                ▶️ MÜZİĞİ BAŞLAT
            </button>

            <audio id="music" loop>

                <source 
                    src="vizyonsuzlar.mp3.mp3"
                    type="audio/mpeg"
                >

            </audio>

        </div>


        <!-- FOTOĞRAFLAR -->

        <div class="photos">

            <div class="photo">
                <img 
                    src="Gemini_Generated_Image_aq6hgaaq6hgaaq6h.jfif"
                    alt="Vizyonsuzlar Anısı 1"
                >
            </div>

            <div class="photo">
                <img 
                    src="Gemini_Generated_Image_jq0l9gjq0l9gjq0l.jfif"
                    alt="Vizyonsuzlar Anısı 2"
                >
            </div>

        </div>


        <!-- MESAJ -->

        <div class="message">

            <h2>Vizyonsuzlar Hakkında 😂</h2>

            <p>
                Gelecek planlarımız yok.<br>
                Geçmişten ders almıyoruz.<br>
                Anlık kararlarla hareket ediyoruz.<br><br>

                Ama nedense hâlâ birlikteyiz. 😂
            </p>

        </div>

    </div>

</div>


<script>

function checkPassword() {

    const password = document.getElementById("password").value;

    if (password === "1234") {

        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("mainScreen").style.display = "block";

    } else {

        document.getElementById("error").style.display = "block";

    }

}


function enterKey(event) {

    if (event.key === "Enter") {

        checkPassword();

    }

}


function toggleMusic() {

    const music = document.getElementById("music");
    const button = document.getElementById("musicButton");

    if (music.paused) {

        music.play();

        button.innerHTML = "⏸️ MÜZİĞİ DURDUR";

    } else {

        music.pause();

        button.innerHTML = "▶️ MÜZİĞİ BAŞLAT";

    }

}

</script>

</body>
</html>
