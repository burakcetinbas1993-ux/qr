<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vizyonsuzlar</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: white;
}

/* ŞİFRE EKRANI */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.loginBox {
    width: 100%;
    max-width: 400px;
    text-align: center;
    padding: 45px 30px;
    background: #151515;
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.lock {
    font-size: 50px;
    margin-bottom: 20px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 15px;
}

.subtitle {
    color: #999;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    text-align: center;
    margin-bottom: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.02);
}

#error {
    display: none;
    color: #ff5555;
    margin-top: 15px;
}


/* ANA SAYFA */

#mainScreen {
    display: none;
    min-height: 100vh;
    padding: 50px 20px;
    text-align: center;
    animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.mainLogo {
    font-size: clamp(40px, 10vw, 80px);
    font-weight: 900;
    letter-spacing: 5px;
    margin-top: 30px;
}

.slogan {
    color: #aaa;
    font-size: 18px;
    margin-top: 10px;
    margin-bottom: 50px;
}


/* FOTOĞRAFLAR */

.photos {
    max-width: 900px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.photo {
    height: 400px;
    border-radius: 20px;
    background: #191919;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #666;
    font-size: 18px;
    overflow: hidden;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


/* ALT YAZI */

.message {
    max-width: 700px;
    margin: 60px auto 20px;
    padding: 30px;
    background: #151515;
    border-radius: 20px;
}

.message h2 {
    margin-top: 0;
}

.message p {
    color: #aaa;
    line-height: 1.7;
}


/* TELEFON */

@media (max-width: 700px) {

    .photos {
        grid-template-columns: 1fr;
    }

    .photo {
        height: 350px;
    }

}

</style>
</head>

<body>


<!-- ŞİFRE EKRANI -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="lock">🔐</div>

        <div class="logo">
            VİZYONSUZLAR
        </div>

        <div class="subtitle">
            Bu sayfaya herkes giremez...
        </div>

        <input
            type="password"
            id="password"
            placeholder="Şifreyi gir"
            onkeypress="enterKey(event)"
        >

        <button onclick="checkPassword()">
            GİRİŞ
        </button>

        <div id="error">
            Yanlış şifre 😏
        </div>

    </div>

</div>



<!-- ANA SAYFA -->

<div id="mainScreen">

    <div class="mainLogo">
        VİZYONSUZLAR
    </div>

    <div class="slogan">
        Plan yok. Vizyon yok. Ama anı çok. 😎
    </div>


    <!-- FOTOĞRAF ALANLARI -->

    <div class="photos">

        <div class="photo">
            📸 FOTOĞRAF 1
        </div>

        <div class="photo">
            📸 FOTOĞRAF 2
        </div>

    </div>


    <!-- MESAJ -->

    <div class="message">

        <h2>Vizyonsuzlar Hakkında 😂</h2>

        <p>
            Gelecek planlarımız yok.
            Geçmişten ders almıyoruz.
            Anlık kararlarla hareket ediyoruz.
            Ama nedense hâlâ birlikteyiz.
        </p>

    </div>

</div>



<script>

function checkPassword() {

    const password = document.getElementById("password").value;

    if (password === "1234") {

        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("mainScreen").style.display = "block";

    } else {

        document.getElementById("error").style.display = "block";

    }

}


function enterKey(event) {

    if (event.key === "Enter") {

        checkPassword();

    }

}

</script>

</body>
</html>
